<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Interaktif SKI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emeraldCustom: {
                            DEFAULT: '#0F5132',
                            dark: '#0A3622',
                            light: '#198754',
                            subtle: '#D1E7DD'
                        },
                        goldCustom: {
                            DEFAULT: '#D4AF37',
                            hover: '#AA820A',
                            light: '#FFF8DC'
                        },
                        creamCustom: '#FAF9F5'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #988c5a;
            color: #212529;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }
        .bento-card {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .bento-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -5px rgba(15, 81, 50, 0.12);
        }
        .gold-border { border-color: #D4AF37; }
        .tab-btn.active {
            background-color: #D4AF37;
            color: #0F5132;
            font-weight: bold;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease;
        }
        .accordion-content.active { max-height: 1000px; }
        .card-hover {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-hover:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .cert-border { border: 12px double #D4AF37; }
        .pulse-active { animation: pulse-ring 2s infinite; }
        .cert-border { border: 12px double #D4AF37; }
    </style>

</head>
<body class="min-h-screen p-4 md:p-8">
        <div class="max-w-3xl mx-auto mb-4">
            <a href="../index.html" class="inline-flex items-center gap-2 bg-emeraldCustom hover:bg-emeraldCustom-dark text-white px-4 py-2 rounded-xl text-sm font-bold transition">
                ← Kembali ke Beranda
            </a>
        </div>
        <!-- SEKSI 3: KUIS INTERAKTIF -->
        <section id="sec-kuis" class="space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-md border border-emerald-100 max-w-3xl mx-auto">
                <div id="quiz-header" class="mb-6">
                    <div class="flex justify-between items-center mb-2">
                        <span id="quiz-progress-text" class="text-xs font-bold text-emeraldCustom uppercase tracking-wider">Soal 1 dari 10</span>
                        <span id="quiz-score-badge" class="text-xs font-bold bg-goldCustom-light text-emeraldCustom-dark px-2.5 py-1 rounded-full border border-goldCustom">Skor: 0</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="quiz-progress-bar" class="bg-emeraldCustom h-2.5 rounded-full transition-all duration-300" style="width: 10%"></div>
                    </div>
                </div>

                <div id="quiz-question-container" class="space-y-4">
                    <h3 id="quiz-question-text" class="text-base md:text-lg font-bold text-gray-800 leading-snug">
                        Loading pertanyaan...
                    </h3>

                    <div id="quiz-options-container" class="space-y-2.5 pt-2"></div>

                    <div id="quiz-feedback-box" class="hidden p-4 rounded-xl text-xs md:text-sm leading-relaxed mt-4">
                        <span id="quiz-feedback-title" class="font-bold block mb-1"></span>
                        <p id="quiz-feedback-text" class="text-gray-700"></p>
                    </div>

                    <div id="quiz-next-container" class="hidden text-right pt-2">
                        <button onclick="nextQuestion()" class="bg-emeraldCustom hover:bg-emeraldCustom-dark text-white px-6 py-2 rounded-xl text-sm font-bold shadow">
                            Lanjut Soal Berikutnya ➔
                        </button>
                    </div>
                </div>

                <div id="quiz-result-container" class="hidden text-center py-6 space-y-4">
                    <div class="w-24 h-24 bg-emerald-100 text-emeraldCustom rounded-full flex items-center justify-center mx-auto text-4xl border-4 border-goldCustom">
                        🎓
                    </div>
                    <h3 class="text-2xl font-bold text-emeraldCustom">Hasil Akhir Kuis SKI</h3>
                    
                    <div class="py-2">
                        <p id="quiz-final-student" class="text-sm font-semibold text-emeraldCustom-dark">Skor Akhir:</p>
                        <span id="quiz-final-score" class="text-4xl font-extrabold text-emeraldCustom">0 / 100</span>
                        <p id="quiz-final-percentage" class="text-sm font-semibold text-gray-500 mt-1">(0% Jawaban Benar)</p>
                    </div>

                    <div id="quiz-predicate-badge" class="inline-block px-4 py-1.5 rounded-full text-sm font-bold bg-goldCustom text-emeraldCustom-dark">
                        Predikat: -
                    </div>

                    <div class="max-w-md mx-auto bg-creamCustom p-4 rounded-xl border border-gray-200 text-left text-xs md:text-sm space-y-2">
                        <p class="font-bold text-emeraldCustom-dark border-b pb-1">Ulasan Belajar Anda:</p>
                        <p id="quiz-review-text" class="text-gray-700 leading-relaxed"></p>
                    </div>

                    <div class="pt-4 flex flex-col sm:flex-row justify-center gap-3">
                        <button onclick="restartQuiz()" class="bg-gray-600 hover:bg-gray-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow transition">
                            🔄 Ulangi Kuis
                        </button>
                        <button onclick="openCertificateModal()" class="bg-goldCustom hover:bg-goldCustom-hover text-emeraldCustom-dark px-6 py-2.5 rounded-xl text-sm font-extrabold shadow-md transition flex items-center justify-center gap-2">
                            <span>📜 Lihat & Unduh Sertifikat</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <div id="cert-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/80 p-4">
            <div class="w-full max-w-lg rounded-2xl border-4 border-goldCustom bg-white p-6 text-center shadow-2xl">
                <button onclick="closeCertificateModal()" class="float-right text-xl font-bold text-gray-500 hover:text-black" aria-label="Tutup">✕</button>
                <h2 class="mb-4 text-xl font-extrabold text-emeraldCustom">Sertifikat Kelulusan SKI</h2>
                <div class="space-y-2 rounded-xl border-2 border-dashed border-goldCustom bg-creamCustom p-5">
                    <p class="text-sm text-gray-600">Diberikan kepada</p>
                    <p id="cert-student-name" class="text-2xl font-bold text-emeraldCustom">Nama Siswa</p>
                    <p id="cert-student-class" class="text-sm text-gray-700">Kelas: X | NIS: -</p>
                    <p class="pt-2 text-sm text-gray-600">Nilai: <strong id="cert-score" class="text-emeraldCustom">0 / 100</strong></p>
                    <p id="cert-predicate" class="font-bold text-emeraldCustom">Predikat</p>
                    <p id="cert-date" class="text-xs text-gray-500"></p>
                </div>
                <canvas id="cert-canvas" class="hidden"></canvas>
                <button onclick="downloadCertificateJPG()" class="mt-4 w-full rounded-xl bg-emeraldCustom px-4 py-3 text-sm font-bold text-white transition hover:bg-emeraldCustom-dark">
                    Unduh Sertifikat JPG
                </button>
            </div>
        </div>

    <script src="/assets/js/index.js"></script>
</body>
</html>
