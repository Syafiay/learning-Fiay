<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forum diskusi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emeraldCustom: {
                            DEFAULT: '#0F5132',
                            dark: '#0A3622',
                            light: '#198754',
                            subtle: '#D1E7DD'
                        },
                        goldCustom: {
                            DEFAULT: '#D4AF37',
                            hover: '#AA820A',
                            light: '#FFF8DC'
                        },
                        creamCustom: '#FAF9F5'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #988c5a;
            color: #212529;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }
        .bento-card {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .bento-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -5px rgba(15, 81, 50, 0.12);
        }
        .gold-border { border-color: #D4AF37; }
        .tab-btn.active {
            background-color: #D4AF37;
            color: #0F5132;
            font-weight: bold;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease;
        }
        .accordion-content.active { max-height: 1000px; }
        .card-hover {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-hover:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .cert-border { border: 12px double #D4AF37; }
        .pulse-active { animation: pulse-ring 2s infinite; }
        .cert-border { border: 12px double #D4AF37; }
    </style>

</head>
<body>
    <section class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full space-y-8">

        <!-- SEKSI 4: RUANG DISKUSI SISWA -->
    <section id="sec-diskusi" class=" space-y-6">
        <div class="bg-gradient-to-r from-teal-800 to-emeraldCustom text-white p-6 rounded-2xl shadow-lg border-b-4 border-goldCustom flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <span class="inline-block bg-goldCustom text-emeraldCustom-dark font-extrabold text-[10px] uppercase px-3 py-1 rounded-full mb-1">Forum Pembelajaran</span>
                <h2 class="text-xl md:text-2xl font-bold text-goldCustom">Ruang Diskusi & Tanya Jawab SKI</h2>
                <p class="text-xs md:text-sm text-teal-100 mt-1">Sampaikan pertanyaan, tanggapan, atau hikmah dakwah sirriyah bersama kawan sekelas.</p>
            </div>
            <div class="bg-white/10 backdrop-blur-sm p-3 rounded-xl border border-white/20 text-xs text-right">
                <span class="text-emerald-200 block">Status Diskusi:</span>
                <span class="font-bold text-goldCustom">Aktif & Terbuka</span>
            </div>
        </div>

        <!-- Form Buat Postingan Baru -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100 space-y-3">
            <h3 class="font-bold text-emeraldCustom text-sm flex items-center gap-2">
                <span>✍️</span> Tulis Pertanyaan atau Tanggapan Baru
            </h3>
            <form onsubmit="postDiscussionMessage(event)" class="space-y-3">
                <textarea id="discussion-input" rows="3" required placeholder="Tuliskan pertanyaan atau pendapat Anda di sini..." 
                          class="w-full p-3 border-2 border-gray-200 rounded-xl text-xs md:text-sm focus:outline-none focus:border-goldCustom transition"></textarea>
                <div class="flex justify-between items-center">
                    <span class="text-[11px] text-gray-500">Posting sebagai: <strong id="discussion-author-display" class="text-emeraldCustom">Siswa</strong></span>
                    <button type="submit" class="bg-emeraldCustom hover:bg-emeraldCustom-dark text-white px-5 py-2 rounded-xl text-xs font-bold shadow transition flex items-center gap-1.5">
                        <span>Kirim Diskusi</span>
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </div>
            </form>
        </div>

        <!-- Daftar Pesan Diskusi -->
        <div class="space-y-4">
            <h3 class="font-bold text-emeraldCustom text-sm flex items-center gap-2">
                <span>💬</span> Utas Diskusi Terbaru
            </h3>
            <div id="discussion-feed" class="space-y-3"></div>
        </div>
    <script src="../../assets/js/index.js"></script>
    <script src="../../assets/js/diskusi.js"></script>
</section>
</section>
<button onclick="window.location.href='../index.html'" class="bg-emerald-800 text-white px-4 py-2 rounded-xl text-sm">
    ← Kembali ke Beranda
</button>
</body>
</html>
